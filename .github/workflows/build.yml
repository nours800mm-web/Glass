      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build
        working-directory: glass
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: LumixTube-APK
          path: glass/app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumix Tube ${{ github.run_number }}
          files: glass/app/build/outputs/apk/debug/app-debug.apk
